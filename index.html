<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことば ふくしゅう ｜ Vocabulary review</title>
<style>
  :root{
    --ground:#eef1f6; --card:#ffffff; --card-border:#e7ebf0;
    --ink:#22303f; --ink-soft:#5b6773; --muted:#98a2ae;
    --accent:#14795d; --accent-ink:#ffffff;
    --shadow:rgba(30,50,80,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#10161d; --card:#1a2531; --card-border:#26333f;
      --ink:#e8eef4; --ink-soft:#a9b5c1; --muted:#6f7d8a;
      --accent:#3fbf92; --accent-ink:#06231a;
      --shadow:rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px; margin:0 auto; padding:34px 18px 64px;}
  h1{font-size:1.35rem; margin:0 0 6px; letter-spacing:.02em;}
  .lead{color:var(--ink-soft); font-size:.95rem; margin:0 0 26px;}
  .lead span{display:block; color:var(--muted); font-size:.85rem; margin-top:2px;}
  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  a.item{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    padding:16px 18px; box-shadow:0 1px 3px var(--shadow);
    transition:transform .08s, border-color .15s;
  }
  a.item:hover{border-color:var(--accent); transform:translateY(-1px);}
  a.item b{display:block; font-size:1.05rem; font-weight:700;}
  a.item small{display:block; color:var(--ink-soft); font-size:.85rem; font-weight:400; margin-top:3px;}
  a.item .go{color:var(--accent); font-weight:700; font-size:.85rem; margin-top:8px; display:block;}
  .note{
    margin-top:28px; color:var(--muted); font-size:.85rem;
    border-top:1px solid var(--card-border); padding-top:14px;
  }
</style>
</head>
<body>
